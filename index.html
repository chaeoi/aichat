<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)" />
    <title>AI Chat</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button class="new-chat-button" id="newChatButton" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <span>新对话</span>
          </button>
          <button class="icon-button sidebar-close" id="sidebarCloseButton" type="button" aria-label="关闭侧边栏">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <nav class="session-list" id="sessionList" aria-label="历史对话"></nav>

        <div class="sidebar-footer">
          <div class="account-row">
            <span class="avatar" id="accountAvatar">U</span>
            <span class="account-info">
              <strong>AI Chat</strong>
              <small id="connectionLabel">未连接</small>
            </span>
            <button class="icon-button" id="logoutButton" type="button" aria-label="退出登录" title="退出登录">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-button menu-button" id="menuButton" type="button" aria-label="打开侧边栏">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>

          <div class="model-menu">
            <button class="model-button" id="modelButton" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="modelButtonLabel">选择模型</span>
              <svg class="chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="model-popover" id="modelPopover" role="listbox"></div>
          </div>

          <button class="icon-button topbar-new-chat" id="topbarNewChatButton" type="button" aria-label="新对话">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
        </header>

        <div class="chat-scroll" id="chatScroll">
          <div class="chat-thread" id="chatThread"></div>
        </div>

        <div class="composer-area">
          <form class="composer" id="composer">
            <div class="composer-box">
              <textarea
                id="promptInput"
                rows="1"
                placeholder="询问任何问题"
                autocomplete="off"
                enterkeyhint="send"
              ></textarea>
              <button class="send-button" id="sendButton" type="submit" aria-label="发送" disabled>
                <svg class="icon-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
                <svg class="icon-stop" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
              </button>
            </div>
          </form>
          <p class="composer-hint">AI 也可能会犯错，请核查重要信息。</p>
        </div>
      </main>
    </div>

    <div class="session-menu" id="sessionMenu" hidden>
      <button type="button" data-action="rename">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        重命名
      </button>
      <button type="button" class="danger" data-action="delete">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        删除
      </button>
    </div>

    <div class="login-overlay" id="loginOverlay">
      <form class="login-card" id="loginForm">
        <h1>AI Chat</h1>
        <p class="login-subtitle">连接你的后端服务开始对话</p>
        <label>
          <span>后端地址</span>
          <input id="backendUrlInput" type="url" placeholder="http://localhost:8000" required />
        </label>
        <label>
          <span>访问密钥</span>
          <input id="accessKeyInput" type="password" placeholder="输入访问密钥" required />
        </label>
        <button type="submit" id="loginSubmitButton">连接</button>
        <p id="loginError" class="login-error" role="alert"></p>
      </form>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="./assets/main.js" defer></script>
  </body>
</html>
